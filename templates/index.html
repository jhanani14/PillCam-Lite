<!DOCTYPE html>
<html>
<head>
    <title>Pill Verification</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <h1>Pill Verification</h1>
    <form action="/verify" method="post" enctype="multipart/form-data">
        <input type="file" name="pill_image" required>
        <input type="submit" value="Verify Pill">
    </form>
    {% if result %}
        <h2>{{ result }}</h2>
    {% endif %}
    <a href="/register">Register a new pill</a>
</body>
</html>
